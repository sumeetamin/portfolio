<!-- index.html : Advanced React-powered portfolio with scroll animations, dark‑mode toggle, served as a single file. Place this in /public, then create a basic Node/Express server (see bottom) to serve it. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sumeet Amin | Web Developer & Data Scientist</title>
  <meta name="description" content="Professional portfolio of Sumeet Amin – full‑stack developer, data scientist, and elite sports analyst." />
  <meta name="keywords" content="Sumeet Amin, Web Developer, Portfolio, React, Node, SEO" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <style>
    :root{
      --primary:#5f27cd;
      --secondary:#341f97;
      --bg-light:#f5f7fa;
      --text-light:#222;
      --bg-dark:#121212;
      --text-dark:#e5e5e5;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;line-height:1.65;background:var(--bg-light);color:var(--text-light);scroll-behavior:smooth;transition:background .3s,color .3s}
    body[data-theme="dark"]{background:var(--bg-dark);color:var(--text-dark)}
    header{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;text-align:center;padding:5rem 1rem 3rem;position:relative}
    nav{margin-top:2rem}
    nav a{color:#fff;margin:0 .8rem;font-weight:600;text-decoration:none}
    nav a:hover{text-decoration:underline}
    .btn{display:inline-block;background:#fff;color:var(--primary);padding:.75rem 1.5rem;border-radius:6px;font-weight:600;text-decoration:none}
    main section{padding:4rem 1rem;max-width:1100px;margin:auto;opacity:0;transform:translateY(40px);transition:opacity .6s ease,transform .6s ease}
    main section.visible{opacity:1;transform:translateY(0)}
    h2{font-size:2rem;margin-bottom:1.5rem;color:var(--primary)}
    body[data-theme="dark"] h2{color:#a880ff}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem}
    .card{background:#fff;border-radius:10px;padding:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.05)}
    body[data-theme="dark"] .card{background:#1e1e1e;box-shadow:0 4px 8px rgba(0,0,0,.4)}
    footer{text-align:center;padding:2rem 1rem;background:#eee;font-size:.9rem}
    body[data-theme="dark"] footer{background:#1e1e1e}
    #darkToggle{position:fixed;top:1rem;right:1rem;background:#fff;color:var(--primary);padding:.5rem;border:none;border-radius:50%;cursor:pointer;font-size:1.1rem;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:1000}
    body[data-theme="dark"] #darkToggle{background:#272727;color:#fdd835}
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <button id="darkToggle" aria-label="Toggle dark mode">🌙</button>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const Header = () => (
      <header id="top">
        <h1>Sumeet Amin</h1>
        <p>Web Developer • Data Scientist • Elite Sports Analyst</p>
        <nav>
          {["about","skills","projects","experience","education","certifications","contact"].map(id => (
            <a key={id} href={`#${id}`}>{id.charAt(0).toUpperCase() + id.slice(1)}</a>
          ))}
        </nav>
        <a href="SUMEET_AMIN_CV.pdf" className="btn" download>Download CV</a>
      </header>
    );

    const Section = React.forwardRef(({ id, title, children }, ref) => (
      <section ref={ref} id={id} className="section">
        <h2>{title}</h2>
        {children}
      </section>
    ));

    function App() {
      const [dark, setDark] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
            }
          });
        }, { threshold: 0.15 });
        document.querySelectorAll(".section").forEach((sec) => observer.observe(sec));
      }, []);

      useEffect(() => {
        document.body.dataset.theme = dark ? "dark" : "light";
      }, [dark]);

      useEffect(() => {
        const btn = document.getElementById("darkToggle");
        const handler = () => setDark((prev) => !prev);
        btn.addEventListener("click", handler);
        return () => btn.removeEventListener("click", handler);
      }, []);

      return (
        <>
          <Header />
          <main>
            <Section id="about" title="Professional Summary">
              <p>Detail-oriented Data Science graduate with hands-on experience as a freelancer and contributor to multiple real-world projects. Currently working as an Elite Sports Analyst at Hudl since June 2024, leveraging data-driven insights to enhance athletic performance. Skilled in data analysis, visualization, and applied machine learning, with a strong foundation in Python, SQL, and modern analytical tools.</p>
            </Section>

            <Section id="skills" title="Skills & Abilities">
              <div className="grid">
                <div className="card"><h3>Programming Languages</h3><p>Python | Java | R | SQL | JavaScript | HTML | CSS</p></div>
                <div className="card"><h3>Data Science & AI Tools</h3><p>Pandas | NumPy | Scikit-learn | TensorFlow | Matplotlib | Seaborn</p></div>
                <div className="card"><h3>Statistics & Analytics</h3><p>Descriptive & Inferential Statistics | Hypothesis Testing | Regression | Time Series Analysis | Industrial Statistics | Data Visualization | Machine Learning | Artificial Intelligence | Reinforcement Learning | Image Processing | Deep Learning</p></div>
                <div className="card"><h3>Web Development</h3><p>Web Programming with HTML/CSS/JavaScript | Backend basics with Node.js or Python Flask | Cloud Computing | Computer Vision</p></div>
                <div className="card"><h3>Tools and Platforms</h3><p>Jupyter Notebook | Google Colab | VS Code | GitHub | Excel | Power BI</p></div>
                <div className="card"><h3>Soft Skills</h3><p>Time Management | Critical Thinking | Communication | Team Collaboration | Problem Solving</p></div>
              </div>
            </Section>

            <Section id="projects" title="Projects">
              <div className="grid">
                <div className="card"><h3>Banking Software Development</h3><p>A Python-based banking application that simulates core financial operations—such as account creation, recurring payments, transaction tracking, and service management—through interactive CSV data storage and a user-friendly CLI interface. <a href="https://github.com/sumeetamin/Banking-software" target="_blank">GitHub</a></p></div>
                <div className="card"><h3>Employee Fitness Tracking</h3><p>Designed a responsive web application to support employee wellness by tracking fitness activities, scheduling workouts, and providing nutrition tips. <a href="https://github.com/sumeetamin/Employee-fitness-webpage" target="_blank">GitHub</a></p></div>
                <div className="card"><h3>Mario Game Training Agent</h3><p>Trained a reinforcement learning agent to autonomously play Super Mario using Deep QLearning (DQN)... <a href="https://github.com/sumeetamin/Mario-game-training-agent-" target="_blank">GitHub</a></p></div>
                <div className="card"><h3>Fitness Coach Chatbot Using OpenAI API</h3><p>Developed an intelligent fitness coach web application powered by OpenAI’s GPT-4... <a href="https://github.com/sumeetamin/fitness-coach-using-open-ai" target="_blank">GitHub</a></p></div>
                <div className="card"><h3>Image Processing Using Computer Vision</h3><p>Utilizes OpenCV and scikit-image in Python to perform end-to-end image processing workflows... <a href="https://github.com/sumeetamin/image-processing-using-computer-vision" target="_blank">GitHub</a></p></div>
              </div>
            </Section>

            <Section id="experience" title="Experience">
              <p><strong>Elite Sport Analyst | Hudl | June 2024 – Present</strong><br/>Working closely with elite sports teams to deliver performance insights through detailed video and data analysis. Responsible for tagging, breaking down, and interpreting match footage to highlight tactical patterns, player metrics, and game strategies.</p>
              <p>Hudl is a leading sports performance technology company that empowers coaches, athletes, and teams—across youth, amateur, and professional levels—with seamless video capture, advanced analytics, smart cameras, and cloud-based data insights to elevate game performance.</p>
            </Section>

            <Section id="education" title="Education">
              <p><strong>Bachelors of Science in Data Science | April 2024</strong><br/>Kandivali Education Society’s B.K Shroff College of Arts & M.H Shroff College of Commerce</p>
            </Section>

            <Section id="certifications" title="Certifications">
              <ul>
                <li>Web Design and Development</li>
                <li>Ethical Hacking</li>
                <li>Data Analytics using Excel</li>
                <li>Advance Microsoft Excel</li>
                <li>Robotic Process Automation</li>
              </ul>
            </Section>

            <Section id="contact" title="Contact">
              <p><strong>Email:</strong> <a href="mailto:aminsumeet@gmail.com">aminsumeet@gmail.com</a></p>
              <p><strong>Phone:</strong> +91 9653484124</p>
              <p><strong>Portfolio Link:</strong> <a href="https://tinyurl.com/y4h5z8ns" target="_blank">tinyurl.com/y4h5z8ns</a></p>
              <p><strong>GitHub:</strong> <a href="https://github.com/sumeetamin" target="_blank">@sumeetamin</a></p>
            </Section>
          </main>
          <footer>
            © {new Date().getFullYear()} Sumeet Amin. All rights reserved.
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
